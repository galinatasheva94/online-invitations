<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вашата покана</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f5f0e8;
            color: #4b4036;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .invitation {
            max-width: 700px;
            width: 100%;
            background: #fffdf9;
            padding: 70px 40px;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(70, 55, 40, 0.12);
        }

        .small-text {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 52px;
            font-weight: normal;
            margin: 0 0 15px;
        }

        .ampersand {
            font-size: 28px;
            font-style: italic;
            margin: 10px 0;
        }

        .date {
            font-size: 20px;
            letter-spacing: 2px;
            margin-top: 35px;
        }

        .message {
            max-width: 500px;
            margin: 45px auto 0;
            line-height: 1.8;
            font-size: 17px;
        }

        .button {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 30px;
            border: 1px solid #8c7a68;
            color: #4b4036;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 13px;
        }

        .button:hover {
            background: #4b4036;
            color: white;
        }

        @media (max-width: 600px) {
            .invitation {
                padding: 50px 25px;
            }

            h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="invitation">

            <div class="small-text">
                Заедно започваме нова глава
            </div>

            <h1>Галина</h1>

            <div class="ampersand">&</div>

            <h1>Мартин</h1>

            <div class="date">
                12 юни 2027
            </div>

            <div class="message">
                <p>
                    С радост ви каним да споделите
                    нашия специален ден с нас.
                </p>

                <p>
                    Ще се радваме да бъдете част
                    от този незабравим момент.
                </p>
            </div>

            <a href="#" class="button">
                ПОТВЪРДИ ПРИСЪСТВИЕ
            </a>

        </div>
    </section>

</body>
</html>
