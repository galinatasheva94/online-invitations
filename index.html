<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F4EAF9">
  <meta name="description" content="The Story Atelier — онлайн покани за специалните моменти.">
  <title>The Story Atelier | Онлайн покани за специалните моменти</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --lavender: #DCC1EE;
      --lavender-light: #F4EAF9;
      --lavender-dark: #8755A6;
      --purple: #70438D;
      --pink: #E5B5D8;
      --pink-light: #F9E8F3;
      --white: #FFFFFF;
      --text: #493550;
      --muted: #806C89;
      --line: #E3CDEB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--lavender-light);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .announcement {
      background: linear-gradient(90deg, #D7B5E9, #EBC3DE, #D7B5E9);
      color: #603C79;
      text-align: center;
      padding: 10px 15px;
      font-size: 11px;
      letter-spacing: 2px;
    }

    header {
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      max-width: 1180px;
      min-height: 100px;
      margin: 0 auto;
      padding: 17px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      color: var(--purple);
      font-size: clamp(27px, 3vw, 37px);
      font-weight: 600;
      line-height: 1.05;
    }

    .brand span {
      display: block;
      margin-top: 8px;
      font-family: 'Montserrat', sans-serif;
      color: #A15F98;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      font-size: 12px;
    }

    .nav-links a:not(.nav-button):hover {
      color: var(--lavender-dark);
    }

    .nav-button,
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      background: var(--purple);
      color: white;
      padding: 13px 24px;
      font-size: 12px;
      font-weight: 500;
      transition: transform 0.2s, background 0.2s;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-button:hover,
    .button:hover {
      background: #59316F;
      transform: translateY(-2px);
    }

    .button-light {
      background: rgba(255, 255, 255, 0.75);
      color: var(--purple);
      border: 1px solid #CDA9DE;
    }

    .button-light:hover {
      background: white;
      color: var(--purple);
    }

    .hero {
      overflow: hidden;
      background:
        radial-gradient(ellipse at 8% 18%, rgba(209, 174, 235, 0.85), transparent 40%),
        radial-gradient(ellipse at 90% 82%, rgba(235, 182, 216, 0.85), transparent 43%),
        linear-gradient(135deg, #EADAF5, #F8E8F3 54%, #E2D0F0);
    }

    .hero-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 70px 28px 78px;
      display: grid;
      grid-template-columns: 1fr 0.9fr;
      align-items: center;
      gap: 55px;
    }

    .eyebrow {
      display: inline-block;
      color: var(--lavender-dark);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      line-height: 1.12;
    }

    h1 {
      font-size: clamp(44px, 5.2vw, 70px);
      color: #603D7B;
      margin-bottom: 22px;
    }

    h1 em {
      color: #A65E98;
      font-weight: 500;
    }

    .hero-description {
      max-width: 510px;
      font-size: 14px;
      line-height: 2;
      color: #6D5978;
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-note {
      margin-top: 25px;
      color: #795F86;
      font-size: 10px;
      letter-spacing: 0.5px;
    }

    /* Избор на месеца */

    .featured {
      position: relative;
      width: 100%;
      max-width: 440px;
      justify-self: center;
    }

    .featured-label {
      text-align: center;
      margin-bottom: 17px;
    }

    .featured-label .eyebrow {
      margin-bottom: 7px;
    }

    .featured-label h2 {
      font-size: clamp(32px, 3.5vw, 43px);
      color: #70438D;
    }

    .featured-card {
      position: relative;
      background: #FFFFFF;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 10px;
      box-shadow: 0 22px 60px rgba(92, 54, 119, 0.22);
    }

    .featured-ribbon {
      display: inline-block;
      position: absolute;
      z-index: 2;
      top: 24px;
      left: 24px;
      background: linear-gradient(100deg, #70438D, #A45D98);
      color: #FFFFFF;
      border-radius: 20px;
      padding: 8px 13px;
      font-size: 9px;
      letter-spacing: 0.7px;
      box-shadow: 0 4px 12px rgba(75, 40, 95, 0.2);
    }

    .featured-video-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 5px;
      background: #E5D5EF;
      line-height: 0;
    }

    .featured-video {
      display: block;
      width: 100%;
      height: 350px;
      object-fit: contain;
      background: #E5D5EF;
    }

    .featured-play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      padding: 0 0 0 5px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 255
