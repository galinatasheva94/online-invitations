<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Галина & Мартин</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #f8f5ee;
    color: #4c4037;
    font-family: "Montserrat", sans-serif;
    overflow-x: hidden;
}


/* =========================================================
   НАЧАЛЕН ЕКРАН
========================================================= */

.opening {
    position: fixed;
    inset: 0;
    z-index: 100;
    background:
        radial-gradient(circle at center, rgba(255,255,255,.7), transparent 55%),
        #f8f5ee;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    transition:
        opacity 1.8s ease,
        visibility 1.8s ease;
}

.opening.finished {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


/* =========================================================
   ФИНА ХАРТИЕНА ТЕКСТУРА
========================================================= */

.paper-texture {
    position: absolute;
    inset: 0;

    opacity: .25;

    background-image:
        radial-gradient(rgba(100,80,60,.08) .7px, transparent .7px);

    background-size: 7px 7px;

    pointer-events: none;
}


/* =========================================================
   ЦЕНТРАЛНО СЪДЪРЖАНИЕ
========================================================= */

.opening-content {
    position: relative;
    z-index: 10;

    width: min(650px, 90vw);

    text-align: center;

    padding: 40px 25px;
}


/* малък надпис */

.opening-small {
    margin-bottom: 20px;

    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;

    color: #927d69;

    opacity: 0;
    transform: translateY(12px);

    animation:
        textAppear 1.4s ease forwards;

    animation-delay: 2.7s;
}


/* имена */

.opening-names {
    margin: 0;

    font-family: "Cormorant Garamond", serif;

    font-size: clamp(55px, 10vw, 100px);

    font-weight: 400;

    line-height: .9;

    color: #514239;

    letter-spacing: -2px;

    opacity: 0;
    transform: translateY(18px);

    animation:
        namesAppear 2s cubic-bezier(.2,.8,.2,1) forwards;

    animation-delay: 2.1s;
}


/* & */

.opening-amp {
    display: block;

    margin: 7px 0 3px;

    font-family: "Cormorant Garamond", serif;

    font-size: 40px;

    color: #a88d72;

    opacity: 0;

    animation:
        ampAppear 1.5s ease forwards;

    animation-delay: 2.4s;
}


/* дата */

.opening-date {
    margin-top: 30px;

    font-size: 12px;

    letter-spacing: 5px;

    color: #806d5c;

    opacity: 0;

    animation:
        textAppear 1.4s ease forwards;

    animation-delay: 3.2s;
}


/* място */

.opening-place {
    margin-top: 11px;

    font-size: 10px;

    letter-spacing: 3px;

    color: #9b8875;

    text-transform: uppercase;

    opacity: 0;

    animation:
        textAppear 1.4s ease forwards;

    animation-delay: 3.5s;
}


/* бутон */

.open-button {
    margin-top: 48px;

    padding: 15px 34px;

    background: transparent;

    border: 1px solid rgba(126,103,82,.55);

    color: #655447;

    font-family: "Montserrat", sans-serif;

    font-size: 10px;

    letter-spacing: 3px;

    cursor: pointer;

    opacity: 0;

    animation:
        buttonAppear 1.5s ease forwards;

    animation-delay: 4s;

    transition:
        background .4s ease,
        color .4s ease,
        transform .4s ease;
}

.open-button:hover {
    background: #695748;
    color: #fff;

    transform: translateY(-2px);
}


/* =========================================================
   ЦВЕТЯ
========================================================= */

.flower-composition {
    position: absolute;

    width: 430px;
    height: 430px;

    pointer-events: none;
}


/* ЛЯВО */

.flower-left {
    left: -90px;
    bottom: -80px;

    transform-origin: bottom left;

    opacity: 0;

    animation:
        flowerLeftAppear 3s cubic-bezier(.2,.7,.2,1) forwards;

    animation-delay: .2s;
}


/* ДЯСНО */

.flower-right {
    right: -100px;
    top: -80px;

    transform-origin: top right;

    opacity: 0;

    animation:
        flowerRightAppear 3s cubic-bezier(.2,.7,.2,1) forwards;

    animation-delay: .7s;
}


/* клонки */

.branch {
    position: absolute;

    width: 3px;

    height: 280px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            #8d9070 20%,
            #7f8466 100%
        );

    border-radius: 50%;

    transform-origin: bottom center;
}


/* лява основна клонка */

.flower-left .branch.one {
    left: 190px;
    bottom: 20px;

    transform:
        rotate(-28deg);
}


/* лява втора */

.flower-left .branch.two {
    left: 250px;
    bottom: 5px;

    height: 220px;

    transform:
        rotate(12deg);
}


/* дясна основна */

.flower-right .branch.one {
    right: 190px;
    top: 20px;

    height: 280px;

    transform:
        rotate(28deg);
}


/* дясна втора */

.flower-right .branch.two {
    right: 250px;
    top: 10px;

    height: 220px;

    transform:
        rotate(-12deg);
}


/* =========================================================
   ЛИСТА
========================================================= */

.leaf {
    position: absolute;

    width: 46px;
    height: 20px;

    background: #9ca184;

    border-radius: 100% 0 100% 0;

    opacity: .78;

    transform-origin: left center;
}


/* лява */

.flower-left .leaf.l1 {
    left: 125px;
    bottom: 135px;
    transform: rotate(-20deg);
}

.flower-left .leaf.l2 {
    left: 165px;
    bottom: 185px;
    transform: rotate(25deg);
}

.flower-left .leaf.l3 {
    left: 225px;
    bottom: 115px;
    transform: rotate(-35deg);
}

.flower-left .leaf.l4 {
    left: 280px;
    bottom: 165px;
    transform: rotate(25deg);
}

.flower-left .leaf.l5 {
    left: 200px;
    bottom: 65px;
    transform: rotate(-45deg);
}


/* дясна */

.flower-right .leaf.l1 {
    right: 125px;
    top: 135px;
    transform: rotate(160deg);
}

.flower-right .leaf.l2 {
    right: 165px;
    top: 185px;
    transform: rotate(205deg);
}

.flower-right .leaf.l3 {
    right: 225px;
    top: 115px;
    transform: rotate(145deg);
}

.flower-right .leaf.l4 {
    right: 280px;
    top: 165px;
    transform: rotate(205deg);
}

.flower-right .leaf.l5 {
    right: 200px;
    top: 65px;
    transform: rotate(135deg);
}


/* =========================================================
   ЦВЕТНИ ГЛАВИ
========================================================= */

.flower {
    position: absolute;

    width: 72px;
    height: 72px;
}


/* венчелистчета */

.petal {
    position: absolute;

    width: 34px;
    height: 48px;

    left: 19px;
    top: 12px;

    border-radius: 70% 30% 70% 30%;

    background:
        radial-gradient(
            ellipse at 50% 80%,
            #d9c6b7 0%,
            #eadcd0 55%,
            #f1e7df 100%
        );

    transform-origin: 50% 90%;
}


/* различни завъртания */

.petal:nth-child(1) {
    transform: rotate(0deg);
}

.petal:nth-child(2) {
    transform: rotate(72deg);
}

.petal:nth-child(3) {
    transform: rotate(144deg);
}

.petal:nth-child(4) {
    transform: rotate(216deg);
}

.petal:nth-child(5) {
    transform: rotate(288deg);
}


/* център */

.flower-center {
    position: absolute;

    left: 30px;
    top: 30px;

    width: 14px;
    height: 14px;

    border-radius: 50%;

    background: #b59a6e;

    box-shadow:
        0 0 0 5px rgba(181,154,110,.12);
}


/* цветя - позиции */

.flower-left .f1 {
    left: 65px;
    bottom: 55px;
    transform: rotate(-18deg) scale(.9);
}

.flower-left .f2 {
    left: 150px;
    bottom: 145px;
    transform: rotate(12deg) scale(1.15);
}

.flower-left .f3 {
    left: 265px;
    bottom: 205px;
    transform: rotate(-20deg) scale(.75);
}

.flower-left .f4 {
    left: 315px;
    bottom: 85px;
    transform: rotate(25deg) scale(.85);
}


.flower-right .f1 {
    right: 65px;
    top: 55px;
    transform: rotate(162deg) scale(.9);
}

.flower-right .f2 {
    right: 150px;
    top: 145px;
    transform: rotate(192deg) scale(1.15);
}

.flower-right .f3 {
    right: 265px;
    top: 205px;
    transform: rotate(160deg) scale(.75);
}

.flower-right .f4 {
    right: 315px;
    top: 85px;
    transform: rotate(205deg) scale(.85);
}


/* =========================================================
   АНИМАЦИИ
========================================================= */

@keyframes flowerLeftAppear {

    0% {
        opacity: 0;
        transform: scale(.7) rotate(-8deg);
    }

    100% {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}


@keyframes flowerRightAppear {

    0% {
        opacity: 0;
        transform: scale(.7) rotate(8deg);
    }

    100% {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}


@keyframes namesAppear {

    0% {
        opacity: 0;
        transform: translateY(25px);
        letter-spacing: 8px;
    }

    100% {
        opacity: 1;
        transform: translateY(0);
        letter-spacing: -2px;
    }
}


@keyframes ampAppear {

    0% {
        opacity: 0;
        transform: scale(.7);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}


@keyframes textAppear {

    0% {
        opacity: 0;
        transform: translateY(12px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }
}


@keyframes buttonAppear {

    0% {
        opacity: 0;
        transform: translateY(15px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   ОСНОВНА ПОКАНА
========================================================= */

.main-content {
    min-height: 100vh;

    opacity: 0;

    transition:
        opacity 1.5s ease;
}


.main-content.visible {
    opacity: 1;
}


/* първа секция */

.invitation-hero {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 60px 25px;

    position: relative;

    background: #f8f5ee;
}


.invitation-inner {
    width: min(650px, 90vw);
}


.invitation-small {
    font-size: 11px;
    letter-spacing: 4px;
    color: #927d69;
    text-transform: uppercase;
}


.invitation-names {
    margin: 25px 0 15px;

    font-family: "Cormorant Garamond", serif;

    font-size: clamp(60px, 11vw, 105px);

    font-weight: 400;

    line-height: .9;

    color: #514239;
}


.invitation-date {
    font-size: 12px;
    letter-spacing: 5px;
    color: #806d5c;
}


.invitation-message {
    max-width: 540px;

    margin: 50px auto 0;

    font-family: "Cormorant Garamond", serif;

    font-size: 23px;

    line-height: 1.6;

    color: #65564b;
}


/* детайли */

.details {
    min-height: 60vh;

    padding: 100px 25px;

    text-align: center;

    background: #eee9df;
}


.details-title {
    font-family: "Cormorant Garamond", serif;

    font-size: 44px;

    font-weight: 400;

    margin-bottom: 45px;
}


.detail {
    margin: 25px 0;
}


.detail-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #9a8673;
}


.detail-value {
    margin-top: 7px;

    font-family: "Cormorant Garamond", serif;

    font-size: 25px;

    color: #514239;
}


/* =========================================================
   МОБИЛЕН
========================================================= */

@media (max-width: 700px) {

    .flower-composition {
        width: 300px;
        height: 300px;
    }

    .flower-left {
        left: -125px;
        bottom: -70px;
    }

    .flower-right {
        right: -135px;
        top: -70px;
    }

    .opening-names {
        font-size: clamp(52px, 16vw, 78px);
    }

    .opening-date {
        letter-spacing: 3px;
    }

}


/* =========================================================
   НАМАЛЕНО ДВИЖЕНИЕ
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }

}

</style>
</head>


<body>


<!-- ======================================================
     НАЧАЛЕН ЕКРАН
====================================================== -->

<section class="opening" id="opening">

    <div class="paper-texture"></div>


    <!-- ЛЯВА ЦВЕТНА КОМПОЗИЦИЯ -->

    <div class="flower-composition flower-left">

        <div class="branch one"></div>
        <div class="branch two"></div>

        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
        <div class="leaf l4"></div>
        <div class="leaf l5"></div>


        <div class="flower f1">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="flower-center"></div>
        </div>


        <div class="flower f2">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="flower-center"></div>
        </div>


        <div class="flower f3">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="flower-center"></div>
        </div>


        <div class="flower f4">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="flower-center"></div>
        </div>

    </div>



    <!-- ДЯСНА ЦВЕТНА КОМПОЗИЦИЯ -->

    <div class="flower-composition flower-right">

        <div class="branch one"></div>
        <div class="branch two"></div>

        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
        <div class="leaf l4"></div>
        <div class="leaf l5"></div>


        <div class="flower f1">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="flower-center"></div>
        </div>


        <div class="flower f2">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="flower-center"></div>
        </div>


        <div class="flower f3">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="flower-center"></div>
        </div>


        <div class="flower f4">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="flower-center"></div>
        </div>

    </div>



    <!-- ЦЕНТЪР -->

    <div class="opening-content">

        <div class="opening-small">
            нашият специален ден
        </div>


        <h1 class="opening-names">
            <span id="openingBride">Галина</span>

            <span class="opening-amp">&amp;</span>

            <span id="openingGroom">Мартин</span>
        </h1>


        <div class="opening-date" id="openingDate">
            12 ЮНИ 2027
        </div>


        <div class="opening-place">
            Резиденция Тера · гр. София
        </div>


        <button
            class="open-button"
            id="openInvitation"
            type="button"
        >
            ОТВОРИ ПОКАНАТА
        </button>

    </div>

</section>



<!-- ======================================================
     ОСНОВНА ПОКАНА
====================================================== -->

<main class="main-content" id="mainContent">


    <section class="invitation-hero">

        <div class="invitation-inner">

            <div class="invitation-small">
                с радост ви каним
            </div>


            <div class="invitation-names">

                <span id="previewBride">
                    Галина
                </span>

                <br>

                <span>
                    &amp;
                </span>

                <br>

                <span id="previewGroom">
                    Мартин
                </span>

            </div>


            <div
                class="invitation-date"
                id="previewDate"
            >
                12 ЮНИ 2027
            </div>


            <div
                class="invitation-message"
                id="previewMessage"
            >
                Ще се радваме да споделите с нас
                един от най-специалните дни в живота ни.
            </div>

        </div>

    </section>



    <section class="details">

        <div class="details-title">
            Нашият ден
        </div>


        <div class="detail">

            <div class="detail-label">
                Дата
            </div>

            <div
                class="detail-value"
                id="detailDate"
            >
                12 ЮНИ 2027
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Място
            </div>

            <div
                class="detail-value"
                id="detailVenue"
            >
                РЕЗИДЕНЦИЯ ТЕРА
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Град
            </div>

            <div
                class="detail-value"
                id="detailCity"
            >
                ГР. СОФИЯ
            </div>

        </div>

    </section>

</main>



<script>

/* =========================================================
   ПОЛУЧАВАМЕ ДАННИТЕ ОТ EDITOR
========================================================= */

const params = new URLSearchParams(
    window.location.search
);


const bride =
    params.get("bride") ||
    "Галина";


const groom =
    params.get("groom") ||
    "Мартин";


const date =
    params.get("date") ||
    "12 ЮНИ 2027";


const venue =
    params.get("venue") ||
    "РЕЗИДЕНЦИЯ ТЕРА";


const city =
    params.get("city") ||
    "ГР. СОФИЯ";


const message =
    params.get("message") ||
    "Ще се радваме да споделите с нас един от най-специалните дни в живота ни.";


/* =========================================================
   ПОПЪЛВАМЕ НАЧАЛНИЯ ЕКРАН
========================================================= */

document.getElementById("openingBride").textContent =
    bride;


document.getElementById("openingGroom").textContent =
    groom;


document.getElementById("openingDate").textContent =
    date;


document.querySelector(".opening-place").textContent =
    venue + " · " + city;


/* =========================================================
   ПОПЪЛВАМЕ ОСНОВНАТА ПОКАНА
========================================================= */

document.getElementById("previewBride").textContent =
    bride;


document.getElementById("previewGroom").textContent =
    groom;


document.getElementById("previewDate").textContent =
    date;


document.getElementById("detailDate").textContent =
    date;


document.getElementById("detailVenue").textContent =
    venue;


document.getElementById("detailCity").textContent =
    city;


/* съобщението може да има два абзаца */

const messageElement =
    document.getElementById("previewMessage");


const paragraphs =
    message.split(/\n\s*\n/);


messageElement.innerHTML =
    paragraphs
        .map(text => text.trim())
        .filter(Boolean)
        .join("<br><br>");



/* =========================================================
   ОТВАРЯНЕ
========================================================= */

const openButton =
    document.getElementById("openInvitation");


const opening =
    document.getElementById("opening");


const mainContent =
    document.getElementById("mainContent");


openButton.addEventListener(
    "click",
    function () {

        opening.classList.add("finished");

        setTimeout(
            function () {

                mainContent.classList.add("visible");

                window.scrollTo({
                    top: 0,
                    behavior: "instant"
                });

            },
            800
        );

    }
);

</script>

</body>
</html>
